name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: |
          pio run -e t-display-s3-touch
          pio run -e t-display-s3-touch-cst816
          pio run -e t-display-s3-scoreboard
          pio run -e t-display-s3-touch -t buildfs
      - name: Package flash images
        run: python3 tools/package.py
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blenny-flash
          path: dist/blenny-*.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/blenny-*.zip --clobber
          else
            gh release create "$TAG" dist/blenny-*.zip --title "$TAG" --generate-notes
          fi
