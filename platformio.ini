[platformio]
default_envs = t-display-s3-touch
src_dir = src
data_dir = data

[env]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_build.embed_files =
  src/toys/movie1.z
  src/toys/movie2.z
  src/toys/movie8.z
  src/queen/julia2.gif
upload_speed = 921600
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.3.1
  https://github.com/mmMicky/TouchLib.git
  nanopb/Nanopb@^0.4.9
  bitbank2/AnimatedGIF@^2.1.1
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DDISABLE_ALL_LIBRARY_WARNINGS
  -DCORE_DEBUG_LEVEL=1

; Carrier board: HOME/VISITOR 2-digit TM1637 on GPIO1/2 and GPIO3/10
[env:t-display-s3-scoreboard]
build_flags =
  ${env.build_flags}
  -DTOUCH_MODULES_CST_MUTUAL
  -DBLENNY_SCOREBOARD

; Newer T-Display S3 Touch boards (CST328)
[env:t-display-s3-touch]
build_flags =
  ${env.build_flags}
  -DTOUCH_MODULES_CST_MUTUAL

; Older T-Display S3 Touch boards (CST816)
[env:t-display-s3-touch-cst816]
build_flags =
  ${env.build_flags}
  -DTOUCH_MODULES_CST_SELF
